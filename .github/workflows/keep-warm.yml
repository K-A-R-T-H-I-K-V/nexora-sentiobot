name: keep-warm

# Softens Cloud Run cold starts on a scale-to-zero (min-instances 0) backend by
# pinging /health every 10 minutes, so a real visitor is more likely to hit a
# warm instance. Free. No-ops until the BACKEND_URL repo variable is set:
#   gh variable set BACKEND_URL --body "https://<your-cloud-run-url>"
#
# Caveat: GitHub's scheduler can run late or skip runs under load; it is a
# best-effort demo warmer, not an uptime SLA. It does not fully eliminate cold
# starts, and it keeps ~1 instance warm during active hours (still ~$0 here).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL not set yet; skipping."
            echo "After deploy: gh variable set BACKEND_URL --body 'https://<cloud-run-url>'"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BACKEND_URL/health" || echo "000")
          echo "GET $BACKEND_URL/health -> $code"
          test "$code" = "200"
