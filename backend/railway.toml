# railway.toml — Railway deployment configuration for the FastAPI backend.
# NOTE (deploy is P6, not yet ratified): the start command runs the app as
# the `backend` package, so the Railway service Root Directory must be the
# repo root (not backend/) for `backend.*` to resolve. Full Railway/Nixpacks
# packaging is validated in the P6 deploy increment.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r backend/requirements.txt"

[deploy]
startCommand = "uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "sentiobot-api"
