# docker-compose.yml — Run the full stack locally with one command.
# Usage: docker compose up --build
#
# The backend runs the built image (code baked in), and only the vector /
# parent stores are mounted from backend/ (they are gitignored and heavy).
# Real credentials come from backend/.env via env_file; create it from
# backend/.env.example first.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DEBUG=true
    volumes:
      - ./backend/vector_db:/app/backend/vector_db
      - ./backend/parent_docstore:/app/backend/parent_docstore
      - ./backend/parents.pkl:/app/backend/parents.pkl
      - ./backend/summaries:/app/backend/summaries
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
